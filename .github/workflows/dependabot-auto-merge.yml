name: Dependabot auto-merge

# Auto-merges Dependabot PRs (non-major only), then merges with a PAT so the
# resulting push to main triggers release-on-deps — a default-GITHUB_TOKEN merge
# would not. The PAT is optional: without the DEPENDABOT_PAT secret it falls back
# to GITHUB_TOKEN and still auto-merges, just without the follow-on release.
#
# One-time repo setup:
#   - "Allow auto-merge" enabled (Settings → General → Pull Requests). [done]
#   - DEPENDABOT_PAT: a repo-scoped PAT (Contents + Pull requests: write) added
#     under Settings → Secrets and variables → Dependabot.
#   - Optional: a ruleset on `main` requiring the "ci" check, so --auto waits
#     for CI instead of merging as soon as the PR is mergeable.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}
